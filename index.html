<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>
     <script src="node_modules/angular/angular.js"></script>
     <script src="app.js"></script>

</head>
<body>

<div ng-controller="LibraryController">
    <h1>{{libraryName}}</h1>

    <div ng-controller="BooksController">
        <h2>Books</h2>

        <label for="newBookName">Add a book:</label>
        <input id="newBookName" type="text" ng-model="newBookName">
        <button type="button" ng-click="addBook()">Add book</button>

        <ul>
            <li ng-repeat="book in books track by $index">
                <input type="text" ng-model="book.name" aria-label="Book name">
                <span>{{book.name}}</span>
            </li>
        </ul>
    </div>
</div>

</body>
</html>
